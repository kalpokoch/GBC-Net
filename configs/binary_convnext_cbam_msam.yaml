# Proposed model: ConvNeXt-Tiny + CBAM + MSAM, cancer vs. normal, 5-fold CV.
#
# Override any key from the command line, e.g.
#   python -m gbcnet.train_binary --config configs/binary_convnext_cbam_msam.yaml \
#       --set train.epochs=2 cv.n_splits=2

seed: 42
deterministic: false          # cudnn.benchmark + TF32 (fast, not bit-reproducible)

data:
  image_dir: data/dataset_masked
  manifest: data/manifests/binary_split_manifest.csv   # relative_path,label,split (train_val|test)
  num_workers: 4              # raise on many-core hosts (augmentation is CPU-bound)
  cache_images: true          # keep decoded grayscale images in RAM
  global_mean: 0.456
  global_std: 0.224

transforms:
  image_size: 512
  center_crop: 350

model:
  name: ConvNeXtTiny_CBAM_MSAM   # any key of gbcnet.models.MODEL_REGISTRY
  pretrained: true
  dropout: 0.5

cv:
  n_splits: 5

train:
  epochs: 250
  warmup_epochs: 10
  min_epochs: 30
  early_stopping_patience: 50
  batch_size: 32               # fallback; replaced by auto-tune when autotune_batch_size=true
  effective_batch_size: 64     # batch_size * accumulation_steps is held at this value
  autotune_batch_size: true
  use_amp: true
  amp_dtype: bfloat16
  grad_clip: 1.0
  mixup_alpha: 0.2
  weighted_sampler: true
  focal_alpha: 0.75
  focal_gamma: 2.0
  warmup_lr:                   # phase 1: backbone frozen
    attention: 2.0e-4
    classifier: 5.0e-4
  warmup_wd:
    attention: 5.0e-3
    classifier: 1.0e-2
  warmup_eta_min: 1.0e-5
  finetune_lr:                 # phase 2: everything trainable
    backbone: 8.0e-6
    attention: 1.0e-5
    classifier: 3.0e-5
  finetune_wd:
    backbone: 1.0e-2
    attention: 5.0e-3
    classifier: 1.0e-2
  restart_t0: 20               # CosineAnnealingWarmRestarts
  restart_t_mult: 2
  finetune_eta_min: 1.0e-7

eval:
  # Decision threshold is fixed at 0.5 (gbcnet.metrics.DECISION_THRESHOLD); no tuning.
  bootstrap: 1000              # bootstrap resamples for 95% CIs on pooled metrics; 0 disables

output:
  dir: outputs/binary_convnext_cbam_msam
